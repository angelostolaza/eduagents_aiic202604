[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historylive-backend"
version = "0.1.0"
description = "HistoryLive AI video pipeline — EduAgents / CUNY AI Innovation Challenge 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # Validation
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Queue / Cache
    "redis[hiredis]>=5.0",
    "rq>=1.16",
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    # Provider SDKs
    "anthropic>=0.30",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "boto3>=1.34",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Rate limiting
    "slowapi>=0.1.9",
    # HTTP
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # IDs
    "python-ulid>=2.2",
    # SSE
    "sse-starlette>=2.1",
    # Retry
    "tenacity>=8.3",
    # Observability
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "A"]
ignore = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
